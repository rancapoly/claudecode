<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capital Investment Advisory</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
/* Capital Investment Advisory — institutional design system */
@import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --paper: #F4F1EA;
  --paper-2: #ECE7DC;
  --card: #FFFEFA;
  --ink: #15202B;
  --ink-2: #34424F;
  --muted: #6B7682;
  --faint: #97A0A9;
  --line: #DDD6C7;
  --line-2: #CBC2AE;
  --accent: #0E5A48;      /* deep institutional teal-green */
  --accent-deep: #0A4135;
  --accent-soft: #E4EDE8;
  --gold: #B68A3E;        /* restrained gold hairline accent */
  --gold-soft: #F0E7D2;
  --go: #1C7A53;
  --go-soft: #E2EFE7;
  --nogo: #A2392C;
  --nogo-soft: #F2E4E1;
  --cond: #A9772A;
  --cond-soft: #F4EAD6;
  --shadow: 0 1px 2px rgba(21,32,43,.04), 0 8px 28px rgba(21,32,43,.06);
  --shadow-lg: 0 2px 6px rgba(21,32,43,.06), 0 24px 60px rgba(21,32,43,.10);

  --serif: 'Spectral', Georgia, serif;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#root { min-height: 100vh; }

::selection { background: var(--accent-soft); }

/* ---------- atmosphere ---------- */
.app-bg {
  min-height: 100vh;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(14,90,72,.05), transparent 60%),
    radial-gradient(900px 500px at -5% 110%, rgba(182,138,62,.05), transparent 55%),
    var(--paper);
}

/* ---------- masthead ---------- */
.masthead {
  border-bottom: 1px solid var(--line-2);
  background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0));
}
.masthead-inner {
  max-width: 1240px; margin: 0 auto; padding: 18px 32px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.monogram {
  width: 42px; height: 42px; flex: none;
  border: 1.5px solid var(--ink); border-radius: 2px;
  display: grid; place-items: center;
  font-family: var(--serif); font-weight: 600; font-size: 20px; color: var(--ink);
  position: relative;
}
.monogram::after {
  content: ""; position: absolute; inset: 3px;
  border: 0.5px solid var(--gold); border-radius: 1px;
}
.brand-text .name {
  font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: .01em; color: var(--ink); line-height: 1.1; white-space: nowrap;
}
.brand-text .sub {
  font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-top: 3px;
}
.masthead-meta { text-align: right; font-size: 11px; color: var(--muted); line-height: 1.6; }
.masthead-meta .tag {
  display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
  color: var(--accent); border: 1px solid var(--line-2); border-radius: 2px; padding: 2px 7px; background: var(--card);
}

/* ---------- generic layout ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
.eyebrow {
  font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent);
  font-weight: 600; display: flex; align-items: center; gap: 10px;
}
.eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--gold); display: inline-block; }
.rule { height: 1px; background: var(--line); border: 0; margin: 0; }
.rule-gold { height: 2px; background: var(--gold); border: 0; width: 44px; }

/* ---------- intake ---------- */
.intake { padding: 40px 0 80px; }
.intake-hero { max-width: 760px; margin: 8px 0 34px; }
.intake-hero h1 {
  font-family: var(--serif); font-weight: 600; font-size: 40px; line-height: 1.08;
  letter-spacing: -.01em; margin: 16px 0 14px;
}
.intake-hero p { font-size: 15.5px; line-height: 1.65; color: var(--ink-2); max-width: 640px; margin: 0; }

.intake-grid { display: grid; grid-template-columns: 1fr 340px; gap: 28px; align-items: start; }
@media (max-width: 980px) { .intake-grid { grid-template-columns: 1fr; } }

.form-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: var(--shadow); overflow: hidden;
}
.form-section { padding: 22px 26px; border-bottom: 1px solid var(--line); }
.form-section:last-child { border-bottom: 0; }
.form-section h3 {
  font-family: var(--sans); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); margin: 0 0 16px; display: flex; align-items: center; gap: 10px;
}
.form-section h3 .idx { font-family: var(--mono); color: var(--gold); font-size: 11px; }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.field-row.one { grid-template-columns: 1fr; }
.field-row.three { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 560px) { .field-row, .field-row.three { grid-template-columns: 1fr; } }

.field { display: flex; flex-direction: column; gap: 6px; }
.field.span2 { grid-column: 1 / -1; }
.field label { font-size: 12px; font-weight: 500; color: var(--ink-2); letter-spacing: .01em; }
.field .hint { font-size: 10.5px; color: var(--faint); }
.field input, .field select, .field textarea {
  font-family: var(--sans); font-size: 14px; color: var(--ink);
  background: #FCFBF7; border: 1px solid var(--line-2); border-radius: 4px;
  padding: 9px 11px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.field input.num { font-family: var(--mono); }
.field textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.field .with-affix { position: relative; display: flex; align-items: center; }
.field .with-affix .affix {
  position: absolute; left: 11px; font-family: var(--mono); font-size: 12px; color: var(--faint);
}
.field .with-affix input { padding-left: 34px; width: 100%; }
.field .with-affix.suffix .affix { right: 11px; left: auto; }
.field .with-affix.suffix input { padding-left: 11px; padding-right: 40px; }

.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; background: #FCFBF7; }
.seg button {
  font-family: var(--sans); font-size: 12.5px; font-weight: 500; color: var(--ink-2);
  background: transparent; border: 0; border-right: 1px solid var(--line-2); padding: 8px 14px; cursor: pointer;
  transition: background .15s, color .15s;
}
.seg button:last-child { border-right: 0; }
.seg button.active { background: var(--accent); color: #fff; }
.seg button:not(.active):hover { background: var(--accent-soft); }

/* aside */
.aside-card {
  background: var(--ink); color: #E9ECEF; border-radius: 6px; box-shadow: var(--shadow-lg);
  padding: 24px 24px 22px; position: sticky; top: 24px;
}
.aside-card h4 { font-family: var(--serif); font-weight: 500; font-size: 18px; margin: 0 0 12px; color: #fff; }
.aside-card .method-list { list-style: none; margin: 0; padding: 0; }
.aside-card .method-list li {
  font-size: 12.5px; color: #B9C2CB; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.08);
  display: flex; gap: 9px; align-items: baseline;
}
.aside-card .method-list li:last-child { border-bottom: 0; }
.aside-card .method-list .k { font-family: var(--mono); font-size: 10px; color: var(--gold); flex: none; width: 18px; }
.aside-note { font-size: 11.5px; color: #8A94A0; line-height: 1.6; margin-top: 16px; }

/* buttons */
.btn {
  font-family: var(--sans); font-weight: 600; font-size: 14px; letter-spacing: .01em;
  border-radius: 4px; padding: 12px 22px; cursor: pointer; border: 1px solid transparent;
  display: inline-flex; align-items: center; gap: 10px; transition: transform .08s, background .15s, box-shadow .15s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 1px 0 var(--accent-deep), var(--shadow); }
.btn-primary:hover { background: var(--accent-deep); }
.btn-ghost { background: transparent; color: var(--ink-2); border-color: var(--line-2); }
.btn-ghost:hover { background: var(--card); border-color: var(--accent); color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn .arr { font-size: 16px; }

.intake-actions { display: flex; align-items: center; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
.intake-actions .spacer { flex: 1; }
.intake-actions .note { font-size: 11.5px; color: var(--muted); }

/* ---------- loading ---------- */
.loading-screen { min-height: 70vh; display: grid; place-items: center; padding: 60px 0; }
.loader { width: 100%; max-width: 540px; text-align: center; }
.loader h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 18px 0 6px; }
.loader .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 30px; }
.steps { text-align: left; display: flex; flex-direction: column; gap: 2px; }
.step {
  display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 5px;
  font-size: 13.5px; color: var(--muted); transition: background .25s, color .25s;
}
.step .dot {
  width: 18px; height: 18px; flex: none; border-radius: 50%; border: 1.5px solid var(--line-2);
  display: grid; place-items: center; font-size: 10px; color: var(--faint);
}
.step.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.step.active .dot { border-color: var(--accent); }
.step.done { color: var(--ink-2); }
.step.done .dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.spin { width: 11px; height: 11px; border: 1.6px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- report ---------- */
.report { padding: 28px 0 96px; }
.report-layout { display: grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: start; }
@media (max-width: 960px) { .report-layout { grid-template-columns: 1fr; } .toc { display: none; } }

.toc { position: sticky; top: 24px; }
.toc .toc-title { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.toc ol { list-style: none; counter-reset: t; margin: 0; padding: 0; }
.toc li { counter-increment: t; }
.toc a {
  display: flex; gap: 10px; align-items: baseline; padding: 7px 0 7px 0; font-size: 13px; color: var(--ink-2);
  text-decoration: none; border-left: 2px solid transparent; padding-left: 12px; margin-left: -12px;
  transition: color .15s, border-color .15s;
}
.toc a::before { content: counter(t, decimal-leading-zero); font-family: var(--mono); font-size: 10.5px; color: var(--gold); flex: none; }
.toc a:hover { color: var(--accent); }
.toc a.active { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.toc .toc-actions { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; }
.toc .toc-actions .btn { padding: 9px 14px; font-size: 12.5px; justify-content: center; }

.doc { background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); }
.doc-head { padding: 30px 40px 26px; border-bottom: 1px solid var(--line); }
.doc-head .meta-row { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; flex-wrap: wrap; }
.doc-head h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.12; letter-spacing: -.01em; margin: 14px 0 8px; max-width: 760px; }
.doc-head .scenario-sub { color: var(--ink-2); font-size: 14px; }
.doc-ref { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; }

.section { padding: 34px 40px; border-bottom: 1px solid var(--line); scroll-margin-top: 20px; }
.section:last-child { border-bottom: 0; }
.section-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
.section-num { font-family: var(--mono); font-size: 12px; color: var(--gold); font-weight: 500; }
.section h2 { font-family: var(--serif); font-weight: 600; font-size: 23px; margin: 0; letter-spacing: -.005em; }
.section .lead { font-size: 15px; line-height: 1.7; color: var(--ink-2); }
.prose p { font-size: 14px; line-height: 1.72; color: var(--ink-2); margin: 0 0 12px; }
.prose p:last-child { margin-bottom: 0; }

/* recommendation banner */
.verdict {
  display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: stretch;
  border-radius: 6px; padding: 24px 26px; border: 1px solid var(--line-2);
}
.verdict.go { background: linear-gradient(180deg, var(--go-soft), #fff); border-color: #BcD9C7; }
.verdict.nogo { background: linear-gradient(180deg, var(--nogo-soft), #fff); border-color: #E3C5BF; }
.verdict.conditional { background: linear-gradient(180deg, var(--cond-soft), #fff); border-color: #E5D2A8; }
.verdict-badge { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-right: 26px; border-right: 1px solid var(--line-2); }
.verdict-badge .label { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.verdict-badge .value { font-family: var(--serif); font-weight: 700; font-size: 38px; line-height: 1; }
.verdict.go .value { color: var(--go); }
.verdict.nogo .value { color: var(--nogo); }
.verdict.conditional .value { color: var(--cond); }
.verdict-body .pref { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.verdict-body .pref b { color: var(--ink); font-weight: 600; }
.verdict-body .rationale { font-family: var(--serif); font-size: 18px; line-height: 1.5; color: var(--ink); }

/* metric chips */
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }
@media (max-width: 720px) { .chips { grid-template-columns: repeat(2, 1fr); } }
.chip { border: 1px solid var(--line); border-radius: 5px; padding: 14px 16px; background: #FCFBF7; }
.chip .k { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.chip .v { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--ink); margin-top: 6px; letter-spacing: -.02em; }
.chip .sub { font-size: 11px; color: var(--faint); margin-top: 3px; font-family: var(--mono); }
.chip.pos .v { color: var(--go); }
.chip.neg .v { color: var(--nogo); }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); }
.tbl thead th {
  font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600;
  border-bottom: 1.5px solid var(--line-2); white-space: nowrap;
}
.tbl td.num, .tbl th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.total td { border-top: 1.5px solid var(--ink); border-bottom: 0; font-weight: 600; color: var(--ink); }
.tbl tr.total td.num { font-weight: 600; }
.tbl tr.subtle td { color: var(--muted); }
.tbl .usd { color: var(--faint); font-size: 11px; }
.tbl-wrap { overflow-x: auto; }
.tbl caption { caption-side: top; text-align: left; font-size: 11px; color: var(--muted); margin-bottom: 8px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
@media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }
.block-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 12px; }

/* formula box */
.formula {
  background: #FAF7EF; border: 1px solid var(--line-2); border-left: 3px solid var(--gold);
  border-radius: 4px; padding: 14px 18px; font-family: var(--mono); font-size: 12.5px; color: var(--ink-2);
  line-height: 1.7; overflow-x: auto;
}
.formula .res { color: var(--accent); font-weight: 600; }
.formula .lbl { color: var(--muted); }

/* K3 compliance */
.k3-item { border: 1px solid var(--line); border-radius: 5px; padding: 0; margin-bottom: 0; }
.tbl .pill {
  display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .04em; padding: 2px 8px; border-radius: 20px; white-space: nowrap;
}
.pill.mandatory { background: var(--nogo-soft); color: var(--nogo); }
.pill.recommended { background: var(--cond-soft); color: var(--cond); }
.reg-code { font-family: var(--mono); font-size: 11px; color: var(--accent); }

/* ops layout zones */
.flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; margin: 6px 0 18px; }
.flow .zone {
  flex: 1 1 0; min-width: 120px; background: #FCFBF7; border: 1px solid var(--line-2); border-radius: 5px;
  padding: 13px 14px; position: relative;
}
.flow .zone .zn { font-family: var(--mono); font-size: 10px; color: var(--gold); }
.flow .zone .zt { font-weight: 600; font-size: 13px; margin: 3px 0 4px; }
.flow .zone .zd { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.flow .arrow { align-self: center; color: var(--line-2); font-size: 20px; padding: 0 6px; flex: none; }
@media (max-width: 640px) { .flow .arrow { transform: rotate(90deg); } }

.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 4px 4px 0; padding: 14px 18px; }
.callout .ct { font-weight: 600; font-size: 13px; color: var(--accent-deep); margin-bottom: 5px; }
.callout p { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); margin: 0; }

.bullets { list-style: none; margin: 0; padding: 0; }
.bullets li { position: relative; padding: 7px 0 7px 22px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.bullets li:last-child { border-bottom: 0; }
.bullets li::before { content: ""; position: absolute; left: 4px; top: 14px; width: 6px; height: 6px; background: var(--gold); border-radius: 50%; }
.bullets.warn li::before { background: var(--nogo); }

/* sensitivity tornado */
.tornado { display: flex; flex-direction: column; gap: 10px; }
.tornado .row { display: grid; grid-template-columns: 160px 1fr; gap: 14px; align-items: center; }
.tornado .row .name { font-size: 12.5px; color: var(--ink-2); text-align: right; }
.tornado .bar-track { position: relative; height: 26px; background: linear-gradient(90deg, transparent, transparent); }
.tornado .center { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--line-2); left: 50%; }
.tornado .bar { position: absolute; top: 4px; height: 18px; border-radius: 2px; }
.tornado .bar.neg { background: linear-gradient(90deg, #C97A6D, var(--nogo)); }
.tornado .bar.pos { background: linear-gradient(90deg, var(--go), #7FB89A); }
.tornado-scale { display: grid; grid-template-columns: 160px 1fr; gap: 14px; font-size: 10.5px; color: var(--faint); font-family: var(--mono); margin-top: 10px; }
.tornado-scale .ax { display: flex; justify-content: space-between; }

@media (max-width: 560px) { .tornado .row { grid-template-columns: 1fr; } .tornado .row .name { text-align: left; } .tornado-scale { grid-template-columns: 1fr; } }

.data-gap { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
.data-gap:last-child { border-bottom: 0; }
.data-gap .tag { font-family: var(--mono); font-size: 10px; color: var(--cond); border: 1px solid var(--cond); border-radius: 3px; padding: 2px 6px; flex: none; margin-top: 1px; }
.data-gap .txt { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

.footnotes { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.footnotes b { color: var(--ink-2); }

.err-note {
  background: var(--cond-soft); border: 1px solid #E5D2A8; color: #7A5A18; border-radius: 5px;
  padding: 12px 16px; font-size: 12.5px; margin: 16px 0; display: flex; gap: 10px; align-items: center;
}

/* svg chart */
.chart-wrap { background: #FCFBF7; border: 1px solid var(--line); border-radius: 5px; padding: 18px 18px 10px; }
.chart-legend { display: flex; gap: 20px; font-size: 11.5px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.chart-legend .key { display: flex; align-items: center; gap: 7px; }
.chart-legend .swatch { width: 14px; height: 3px; border-radius: 2px; }

/* Resting state is fully visible. Animate transform ONLY — never opacity —
   so a paused/un-run animation can never strand content invisible. */

  <script>
/* finance.js — auditable capital-investment math.
 * All monetary inputs are expressed in MILLIONS of IDR.
 * Pure functions, attached to window.Fin. No rounding until display.
 */
(function () {
  "use strict";

  // Build a year-by-year cash-flow schedule for a single option.
  // option: { capex:[{item,amount}], opexAnnual:[{item,amount}], annualBenefit,
  //           benefitGrowth, opexGrowth, salvageValue }
  function buildCashFlows(option, horizonYears) {
    const capexTotal = sum((option.capex || []).map((c) => num(c.amount)));
    const opexBase = sum((option.opexAnnual || []).map((c) => num(c.amount)));
    const g = num(option.benefitGrowth);
    const infl = num(option.opexGrowth);
    const benefit0 = num(option.annualBenefit);
    const salvage = num(option.salvageValue);
    const rows = [];
    // Year 0 — capital outlay only.
    rows.push({ year: 0, capex: capexTotal, benefit: 0, opex: 0, net: -capexTotal });
    for (let t = 1; t <= horizonYears; t++) {
      const benefit = benefit0 * Math.pow(1 + g, t - 1);
      const opex = opexBase * Math.pow(1 + infl, t - 1);
      let net = benefit - opex;
      if (t === horizonYears) net += salvage;
      rows.push({ year: t, capex: 0, benefit: benefit, opex: opex, salvage: t === horizonYears ? salvage : 0, net: net });
    }
    return rows;
  }

  function npv(rows, rate) {
    return rows.reduce((acc, r) => acc + r.net / Math.pow(1 + rate, r.year), 0);
  }

  // IRR by bisection. Returns null when no sign change (no real IRR).
  function irr(rows) {
    const f = (r) => npv(rows, r);
    let lo = -0.9, hi = 5.0;
    let flo = f(lo), fhi = f(hi);
    if (isNaN(flo) || isNaN(fhi)) return null;
    if (flo * fhi > 0) {
      // try a wider high bound
      hi = 20;
      fhi = f(hi);
      if (flo * fhi > 0) return null;
    }
    for (let i = 0; i < 200; i++) {
      const mid = (lo + hi) / 2;
      const fmid = f(mid);
      if (Math.abs(fmid) < 1e-7) return mid;
      if (flo * fmid < 0) { hi = mid; fhi = fmid; }
      else { lo = mid; flo = fmid; }
    }
    return (lo + hi) / 2;
  }

  // Cumulative series (undiscounted + discounted) and payback crossover years.
  function paybackSeries(rows, rate) {
    let cum = 0, cumD = 0;
    const series = rows.map((r) => {
      cum += r.net;
      cumD += r.net / Math.pow(1 + rate, r.year);
      return { year: r.year, cum: cum, cumD: cumD };
    });
    return {
      series: series,
      simple: crossing(series, "cum"),
      discounted: crossing(series, "cumD"),
    };
  }

  // Linear-interpolated year where a cumulative series first turns non-negative.
  function crossing(series, key) {
    for (let i = 1; i < series.length; i++) {
      const prev = series[i - 1][key];
      const cur = series[i][key];
      if (prev < 0 && cur >= 0) {
        const frac = prev === cur ? 0 : -prev / (cur - prev);
        return series[i - 1].year + frac;
      }
    }
    return null; // never pays back within horizon
  }

  // Total cost of ownership: capex + lifecycle opex (nominal & discounted).
  function tco(option, horizonYears, rate) {
    const rows = buildCashFlows(option, horizonYears);
    const capexTotal = rows[0].capex;
    let opexNom = 0, opexDisc = 0;
    rows.forEach((r) => {
      if (r.year > 0) {
        opexNom += r.opex;
        opexDisc += r.opex / Math.pow(1 + rate, r.year);
      }
    });
    return { nominal: capexTotal + opexNom, discounted: capexTotal + opexDisc, capex: capexTotal, opexNominal: opexNom };
  }

  // Full metric pack for one option.
  function analyzeOption(option, horizonYears, rate) {
    const rows = buildCashFlows(option, horizonYears);
    const pv = npv(rows, rate);
    const r = irr(rows);
    const pb = paybackSeries(rows, rate);
    const t = tco(option, horizonYears, rate);
    const capexTotal = rows[0].capex;
    const profitabilityIndex = capexTotal > 0 ? (pv + capexTotal) / capexTotal : null;
    return {
      rows: rows,
      capexTotal: capexTotal,
      opexYear1: rows[1] ? rows[1].opex : 0,
      npv: pv,
      irr: r,
      simplePayback: pb.simple,
      discountedPayback: pb.discounted,
      paybackSeries: pb.series,
      tco: t,
      profitabilityIndex: profitabilityIndex,
    };
  }

  // One-at-a-time sensitivity (tornado): % change in each driver -> Δ NPV.
  // drivers vary by ±swing. Returns sorted by absolute swing magnitude.
  function sensitivity(option, horizonYears, rate, swing) {
    swing = swing || 0.15;
    const base = npv(buildCashFlows(option, horizonYears), rate);
    const clone = () => JSON.parse(JSON.stringify(option));

    function withCapex(mult) {
      const o = clone();
      o.capex = (o.capex || []).map((c) => ({ ...c, amount: num(c.amount) * mult }));
      return npv(buildCashFlows(o, horizonYears), rate);
    }
    function withBenefit(mult) {
      const o = clone();
      o.annualBenefit = num(o.annualBenefit) * mult;
      return npv(buildCashFlows(o, horizonYears), rate);
    }
    function withOpex(mult) {
      const o = clone();
      o.opexAnnual = (o.opexAnnual || []).map((c) => ({ ...c, amount: num(c.amount) * mult }));
      return npv(buildCashFlows(o, horizonYears), rate);
    }
    function withRate(delta) {
      return npv(buildCashFlows(option, horizonYears), rate + delta);
    }

    const drivers = [
      { key: "Annual benefit / revenue", down: withBenefit(1 - swing), up: withBenefit(1 + swing), label: "±" + pct(swing) },
      { key: "CAPEX", down: withCapex(1 + swing), up: withCapex(1 - swing), label: "±" + pct(swing) },
      { key: "Annual OPEX", down: withOpex(1 + swing), up: withOpex(1 - swing), label: "±" + pct(swing) },
      { key: "Discount rate", down: withRate(0.02), up: withRate(-0.02), label: "±2.0 pp" },
    ];
    drivers.forEach((d) => {
      d.base = base;
      d.deltaDown = d.down - base;
      d.deltaUp = d.up - base;
      d.range = Math.abs(d.up - d.down);
    });
    drivers.sort((a, b) => b.range - a.range);
    return { base: base, drivers: drivers };
  }

  // ---- helpers ----
  function sum(a) { return a.reduce((x, y) => x + (isFinite(y) ? y : 0), 0); }
  function num(v) { const n = typeof v === "string" ? parseFloat(v.replace(/[, ]/g, "")) : v; return isFinite(n) ? n : 0; }
  function pct(x) { return (x * 100).toFixed(0) + "%"; }

  // ---- formatting (millions IDR in; pretty strings out) ----
  // value is in MILLIONS of IDR.
  function fmtIDR(valM, opts) {
    opts = opts || {};
    const sign = valM < 0 ? "−" : "";
    const a = Math.abs(valM);
    let body;
    if (a >= 1e6) body = (a / 1e6).toFixed(opts.dp ?? 2) + " tn"; // trillion
    else if (a >= 1e3) body = (a / 1e3).toFixed(opts.dp ?? 2) + " bn";
    else body = a.toFixed(opts.dp ?? (a < 10 ? 1 : 0)) + " mn";
    return (opts.noRp ? "" : "Rp ") + sign + body;
  }
  function fmtUSD(valM, fxRate) {
    // valM in million IDR; fxRate = IDR per USD
    if (!fxRate) return "";
    const usd = (valM * 1e6) / fxRate; // in USD
    const sign = usd < 0 ? "−" : "";
    const a = Math.abs(usd);
    let body;
    if (a >= 1e6) body = "$" + (a / 1e6).toFixed(2) + "M";
    else if (a >= 1e3) body = "$" + (a / 1e3).toFixed(1) + "K";
    else body = "$" + a.toFixed(0);
    return sign + body;
  }
  function fmtPct(x, dp) { if (x == null || !isFinite(x)) return "—"; return (x * 100).toFixed(dp ?? 1) + "%"; }
  function fmtYears(y) {
    if (y == null) return "Beyond horizon";
    const yr = Math.floor(y);
    const mo = Math.round((y - yr) * 12);
    if (mo === 0) return yr + (yr === 1 ? " yr" : " yrs");
    if (mo === 12) return (yr + 1) + " yrs";
    return yr + "y " + mo + "m";
  }

  window.Fin = {
    buildCashFlows, npv, irr, paybackSeries, crossing, tco, analyzeOption, sensitivity,
    fmtIDR, fmtUSD, fmtPct, fmtYears, num,
  };
})();
  </script>

  <script type="text/babel">
/* components.jsx — shared report UI. Exports to window for cross-file use. */
const { useMemo } = React;
const F = window.Fin;

/* Money: primary IDR with faint USD reference underneath (optional). */
function Money({ m, usd = false, fx, dp, className = "" }) {
  return (
    <span className={className}>
      <span>{F.fmtIDR(m, { dp })}</span>
      {usd && fx ? <span className="usd"> · {F.fmtUSD(m, fx)}</span> : null}
    </span>
  );
}

function MetricChip({ k, v, sub, tone }) {
  const cls = tone === "pos" ? "chip pos" : tone === "neg" ? "chip neg" : "chip";
  return (
    <div className={cls}>
      <div className="k">{k}</div>
      <div className="v">{v}</div>
      {sub ? <div className="sub">{sub}</div> : null}
    </div>
  );
}

/* Cumulative cash-flow chart: undiscounted + discounted, with payback crossover. */
function CashFlowChart({ series, simple, discounted, fx }) {
  const W = 680, H = 280, padL = 64, padR = 18, padT = 18, padB = 36;
  const iw = W - padL - padR, ih = H - padT - padB;

  const years = series.map((s) => s.year);
  const vals = series.flatMap((s) => [s.cum, s.cumD]);
  const minV = Math.min(0, ...vals), maxV = Math.max(0, ...vals);
  const xMax = Math.max(...years);

  const x = (yr) => padL + (xMax === 0 ? 0 : (yr / xMax) * iw);
  const y = (v) => padT + ih - ((v - minV) / (maxV - minV || 1)) * ih;

  const path = (key) => series.map((s, i) => (i === 0 ? "M" : "L") + x(s.year).toFixed(1) + "," + y(s[key]).toFixed(1)).join(" ");
  const area = (key) => "M" + x(0) + "," + y(0) + " " + series.map((s) => "L" + x(s.year).toFixed(1) + "," + y(s[key]).toFixed(1)).join(" ") + " L" + x(xMax) + "," + y(0) + " Z";

  // y gridlines (5 ticks)
  const ticks = [];
  const step = niceStep((maxV - minV) / 4);
  for (let v = Math.ceil(minV / step) * step; v <= maxV + 1e-6; v += step) ticks.push(v);

  const zeroY = y(0);

  return (
    <div className="chart-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cumulative cash flow">
        {/* gridlines */}
        {ticks.map((t, i) => (
          <g key={i}>
            <line x1={padL} x2={W - padR} y1={y(t)} y2={y(t)} stroke="#E6DFD0" strokeWidth="1" />
            <text x={padL - 8} y={y(t) + 3.5} textAnchor="end" fontFamily="var(--mono)" fontSize="9.5" fill="#97A0A9">
              {F.fmtIDR(t, { dp: t === 0 ? 0 : 0, noRp: true })}
            </text>
          </g>
        ))}
        {/* zero line */}
        <line x1={padL} x2={W - padR} y1={zeroY} y2={zeroY} stroke="#15202B" strokeWidth="1.2" />
        {/* x labels */}
        {years.map((yr) => (
          <text key={yr} x={x(yr)} y={H - 14} textAnchor="middle" fontFamily="var(--mono)" fontSize="9.5" fill="#97A0A9">{yr}</text>
        ))}
        <text x={padL + iw / 2} y={H - 2} textAnchor="middle" fontSize="9.5" fill="#6B7682" letterSpacing="1.5">YEAR</text>

        {/* areas */}
        <path d={area("cum")} fill="rgba(14,90,72,.07)" />
        {/* discounted line */}
        <path d={path("cumD")} fill="none" stroke="#B68A3E" strokeWidth="2" strokeDasharray="5 4" />
        {/* undiscounted line */}
        <path d={path("cum")} fill="none" stroke="#0E5A48" strokeWidth="2.4" />

        {/* crossover markers */}
        {crossMarker(simple, "cum", series, x, y, zeroY, "#0E5A48")}
        {crossMarker(discounted, "cumD", series, x, y, zeroY, "#B68A3E")}

        {/* end dots */}
        <circle cx={x(xMax)} cy={y(series[series.length - 1].cum)} r="3" fill="#0E5A48" />
      </svg>
      <div className="chart-legend">
        <span className="key"><span className="swatch" style={{ background: "#0E5A48" }}></span> Cumulative net cash flow (nominal)</span>
        <span className="key"><span className="swatch" style={{ background: "#B68A3E", height: "0", borderTop: "2px dashed #B68A3E" }}></span> Discounted (PV)</span>
        <span className="key" style={{ color: "#6B7682" }}>Crossover = payback</span>
      </div>
    </div>
  );
}

function crossMarker(yr, key, series, x, y, zeroY) {
  if (yr == null) return null;
  const cx = x(yr);
  return (
    <g>
      <line x1={cx} x2={cx} y1={zeroY - 7} y2={zeroY + 7} stroke="#15202B" strokeWidth="1" />
      <circle cx={cx} cy={zeroY} r="3.5" fill="#fff" stroke="#15202B" strokeWidth="1.4" />
      <text x={cx} y={zeroY - 12} textAnchor="middle" fontFamily="var(--mono)" fontSize="9.5" fill="#15202B" fontWeight="600">
        {F.fmtYears(yr)}
      </text>
    </g>
  );
}

function niceStep(raw) {
  if (raw <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  let nice;
  if (norm < 1.5) nice = 1; else if (norm < 3) nice = 2; else if (norm < 7) nice = 5; else nice = 10;
  return nice * mag;
}

/* Sensitivity tornado. drivers: [{key, deltaDown, deltaUp, label, base}] */
function Tornado({ data, fx }) {
  const drivers = data.drivers;
  const maxAbs = Math.max(...drivers.flatMap((d) => [Math.abs(d.deltaDown), Math.abs(d.deltaUp)]), 1);
  const toPct = (v) => Math.min(50, (Math.abs(v) / maxAbs) * 50); // half-width %

  return (
    <div>
      <div className="tornado">
        {drivers.map((d, i) => (
          <div className="row" key={i}>
            <div className="name">{d.key} <span style={{ color: "var(--faint)", fontFamily: "var(--mono)", fontSize: "10.5px" }}>{d.label}</span></div>
            <div className="bar-track">
              <div className="center"></div>
              {/* downside (left, negative delta) */}
              <div className="bar neg" style={{ right: "50%", width: toPct(d.deltaDown) + "%" }} title={F.fmtIDR(d.deltaDown)}></div>
              {/* upside (right) */}
              <div className="bar pos" style={{ left: "50%", width: toPct(d.deltaUp) + "%" }} title={F.fmtIDR(d.deltaUp)}></div>
            </div>
          </div>
        ))}
      </div>
      <div className="tornado-scale">
        <div></div>
        <div className="ax">
          <span>−{F.fmtIDR(maxAbs, { dp: 0 })}</span>
          <span>Δ NPV vs base</span>
          <span>+{F.fmtIDR(maxAbs, { dp: 0 })}</span>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { Money, MetricChip, CashFlowChart, Tornado });
  </script>

const { useState: useStateR, useEffect: useEffectR, useRef: useRefR, useMemo: useMemoR } = React;
const Fr = window.Fin;

const SECTIONS = [
  { id: "recommendation", label: "Recommendation" },
  { id: "financial", label: "Financial analysis" },
  { id: "payback", label: "Payback estimation" },
  { id: "k3", label: "K3 considerations" },
  { id: "operations", label: "Business process" },
  { id: "assumptions", label: "Assumptions & gaps" },
  { id: "risks", label: "Risks & sensitivities" },
];

function lineSum(arr) { return (arr || []).reduce((a, x) => a + Fr.num(x.amount), 0); }

function Report({ analysis, caseMeta, onReset, errors }) {
  const model = analysis.model;
  const fx = model.fxRate;
  const rate = model.discountRate;
  const horizon = model.horizonYears;

  const metrics = useMemoR(
    () => model.options.map((o) => Fr.analyzeOption(o, horizon, rate)),
    [analysis]
  );
  const prefIdx = analysis.recommendation.preferredOption ?? 0;
  const pref = model.options[prefIdx];
  const prefM = metrics[prefIdx];
  const sens = useMemoR(() => Fr.sensitivity(pref, horizon, rate), [analysis]);

  const [active, setActive] = useStateR("recommendation");
  useEffectR(() => {
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
      },
      { rootMargin: "-20% 0px -70% 0px", threshold: 0 }
    );
    SECTIONS.forEach((s) => { const el = document.getElementById(s.id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, []);

  const today = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  const ref = "CIA-" + (caseMeta.location || "").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase() + "-" + new Date().getFullYear();

  const verdictClass = analysis.recommendation.verdict === "GO" ? "go" : analysis.recommendation.verdict === "NO-GO" ? "nogo" : "conditional";

  return (
    <div className="report wrap">
      <div className="report-layout">
        {/* TOC */}
        <nav className="toc">
          <div className="toc-title">Contents</div>

            {SECTIONS.map((s) => (

          <div className="toc-actions">

              </div>

          </header>

          {errors && errors.length ? (
            <div style={{ padding: "0 40px", marginTop: "18px" }}>
              <div className="err-note">
                <span>⚠</span>
                <span>Some sections used the worked-example fallback ({errors.join(", ")}). Re-run to retry the live analysis.</span>
              </div>

              <MetricChip k="Discounted payback" v={Fr.fmtYears(prefM.discountedPayback)} sub={"simple " + Fr.fmtYears(prefM.simplePayback)} />

          {/* 7 — RISKS */}
          <section className="section" id="risks">
            <SecHead n="07" title="Risks & sensitivities" />
            <p className="prose" style={{ marginBottom: "18px" }}>{analysis.risks.narrative}</p>

            <div className="block-label">Sensitivity of NPV to key drivers (tornado)</div>
            <Tornado data={sens} fx={fx} />

            <div className="tbl-wrap" style={{ marginTop: "26px" }}>
              <table className="tbl">
                <caption>Risk register</caption>
                <thead>
                  <tr><th>Risk</th><th>Likelihood</th><th>Impact</th><th>Mitigation</th></tr>
                </thead>
                <tbody>
                  {analysis.risks.register.map((r, i) => (
                    <tr key={i}>
                      <td style={{ minWidth: "200px" }}>{r.risk}</td>
                      <td><LikChip v={r.likelihood} /></td>
                      <td><LikChip v={r.impact} /></td>
                      <td style={{ fontSize: "12.5px", color: "var(--ink-2)" }}>{r.mitigation}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>

          <div style={{ padding: "22px 40px", color: "var(--muted)", fontSize: "11.5px", borderTop: "1px solid var(--line)", display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: "10px" }}>
            <span>{ref} · Capital Investment Advisory</span>
            <span>Decision-grade analysis · figures computed &amp; auditable · methods applied selectively to the case</span>
          </div>
        </article>
      </div>
    </div>
  );
}

function SecHead({ n, title }) {
  return (
    <div className="section-head">
      <span className="section-num">{n}</span>
      <h2>{title}</h2>
    </div>
  );
}

function MetricRow({ label, m, pick, prefIdx, n, strong }) {
  return (
    <tr className={strong ? "total" : ""}>
      <td>{label}</td>
      {m.map((x, i) => (
        <td key={i} className="num" style={i === prefIdx && n > 1 ? { color: "var(--accent)", fontWeight: 600 } : null}>{pick(x)}</td>
      ))}
    </tr>
  );
}

function CostTable({ rows, fx, total }) {
  const t = lineSum(rows);
  return (
    <table className="tbl">
      <tbody>
        {rows.map((r, i) => (
          <tr key={i}>
            <td>{r.item}</td>
            <td className="num">{Fr.fmtIDR(Fr.num(r.amount))} <span className="usd">{Fr.fmtUSD(Fr.num(r.amount), fx)}</span></td>
          </tr>
        ))}
        <tr className="total"><td>{total}</td><td className="num">{Fr.fmtIDR(t)} <span className="usd">{Fr.fmtUSD(t, fx)}</span></td></tr>
      </tbody>
    </table>
  );
}

function LikChip({ v }) {
  const map = { high: "var(--nogo)", medium: "var(--cond)", low: "var(--go)" };
  const c = map[(v || "").toLowerCase()] || "var(--muted)";
  return <span style={{ color: c, fontWeight: 600, fontSize: "12px" }}>{v}</span>;
}

window.Report = Report;
  </script>
  <script type="text/babel">
/* app.jsx — state machine + live Claude orchestration. */
const { useState, useEffect, useRef } = React;

const DEFAULT_CASE = {
  facilityType: "Distribution warehouse",
  location: "",
  landArea: "",
  buildingArea: "",
  purpose: "",
  decisionType: "build-vs-lease",
  horizonYears: 10,
  discountRate: 12,
  fxRate: 16250,
  knownCosts: "",
  expectedBenefit: "",
  notes: "",
};

const GEN_STEPS = [
  { id: "frame", label: "Framing the scenario & cost structure" },
  { id: "finance", label: "Building CAPEX / OPEX & cash-flow model" },
  { id: "k3", label: "Assessing K3 / SMK3 compliance" },
  { id: "ops", label: "Evaluating layout, flow & capacity" },
  { id: "synth", label: "Synthesising recommendation & risks" },
];

// ---- JSON schema prompt ----
function buildPrompt(c) {
  return `You are a senior capital investment advisor for corporate real estate and industrial facilities in Indonesia, combining financial analysis, Indonesian K3/SMK3 occupational health & safety compliance, and operations/process design.

Analyse the following investment case and return ONLY a single JSON object (no markdown, no prose, no code fences) matching the exact schema below.

INVESTMENT CASE:
- Facility type: ${c.facilityType}
- Location: ${c.location || "(not specified)"}
- Land area: ${c.landArea || "?"} m²; Building area: ${c.buildingArea || "?"} m²
- Purpose: ${c.purpose || "(not specified)"}
- Decision type: ${c.decisionType}
- Analysis horizon: ${c.horizonYears} years
- Discount rate (WACC): ${c.discountRate}%
- FX reference: Rp ${c.fxRate} / USD
- Known costs: ${c.knownCosts || "(none provided — estimate from typical Indonesian market rates and STATE the assumption)"}
- Expected benefit: ${c.expectedBenefit || "(none provided — estimate and STATE the assumption)"}
- Notes: ${c.notes || "(none)"}

RULES:
- ALL monetary amounts MUST be expressed in MILLIONS of IDR as plain numbers (e.g. 42000 means Rp 42 billion). Never use strings, currency symbols, or units inside numeric fields.
- Build a realistic cost structure. If the decision type implies comparison (build-vs-lease, make-vs-buy), provide 2 options; otherwise provide 1.
- Each option needs capex line items, annual opex line items, an annualBenefit, growth rates (decimals like 0.04), and a salvageValue at end of horizon.
- discountRate in the model object must be a DECIMAL (e.g. 0.12). horizonYears an integer.
- K3: assess against real Indonesian OHS regs (UU 1/1970, PP 50/2012 SMK3, relevant Kepmenaker/Permenaker/SNI for THIS facility type). Each item: requirement, regulation (code), mandatory (bool), costImpact (million IDR), timeline, risk (one sentence). Make items SPECIFIC to the facility type.
- Operations: assess layout/flow/capacity for THIS facility type; give ordered process zones, real bottlenecks, a recommended configuration, and 2-3 operating metrics.
- recommendation.verdict must be one of "GO", "NO-GO", "CONDITIONAL". verdictLabel is a short human label. preferredOption is the 0-based index of the best option.
- Do NOT compute NPV/IRR/payback yourself — those are computed downstream from your cash-flow model. Focus on realistic inputs and qualitative analysis.
- Be specific and decision-oriented. No filler.

SCHEMA (return exactly this shape):
{
  "model": {
    "scenarioTitle": string,
    "currency": "IDR",
    "fxRate": ${c.fxRate},
    "discountRate": ${(Number(c.discountRate) / 100).toFixed(4)},
    "horizonYears": ${Number(c.horizonYears)},
    "options": [
      {
        "name": string,
        "type": "build" | "lease" | "make" | "buy",
        "capex": [ { "item": string, "amount": number } ],
        "opexAnnual": [ { "item": string, "amount": number } ],
        "annualBenefit": number,
        "benefitGrowth": number,
        "opexGrowth": number,
        "salvageValue": number,
        "notes": string
      }
    ]
  },
  "recommendation": { "verdict": string, "verdictLabel": string, "preferredOption": number, "rationale": string, "conditions": [string] },
  "financialAssumptions": [string],
  "k3": { "summary": string, "items": [ { "requirement": string, "regulation": string, "mandatory": boolean, "costImpact": number, "timeline": string, "risk": string } ] },
  "ops": { "assessment": string, "zones": [ { "name": string, "role": string, "note": string } ], "bottlenecks": [string], "recommendedConfig": string, "metrics": [ { "label": string, "value": string, "note": string } ] },
  "assumptions": [string],
  "dataGaps": [ { "need": string, "why": string } ],
  "risks": { "narrative": string, "register": [ { "risk": string, "likelihood": string, "impact": string, "mitigation": string } ] }
}`;
}

function extractJSON(text) {
  if (!text) throw new Error("empty");
  let t = text.trim();
  // strip code fences if any
  t = t.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "");
  const start = t.indexOf("{");
  const end = t.lastIndexOf("}");
  if (start === -1 || end === -1) throw new Error("no json object");
  return JSON.parse(t.slice(start, end + 1));
}

function validate(a) {
  if (!a || !a.model || !Array.isArray(a.model.options) || !a.model.options.length) throw new Error("missing model.options");
  if (!a.recommendation || !a.k3 || !a.ops || !a.risks) throw new Error("missing sections");
  // coerce numerics
  a.model.discountRate = Number(a.model.discountRate) || 0.12;
  a.model.horizonYears = Math.round(Number(a.model.horizonYears) || 10);
  a.model.fxRate = Number(a.model.fxRate) || 16250;
  a.model.options.forEach((o) => {
    o.capex = (o.capex || []).map((x) => ({ item: x.item, amount: Number(x.amount) || 0 }));
    o.opexAnnual = (o.opexAnnual || []).map((x) => ({ item: x.item, amount: Number(x.amount) || 0 }));
    o.annualBenefit = Number(o.annualBenefit) || 0;
    o.benefitGrowth = Number(o.benefitGrowth) || 0;
    o.opexGrowth = Number(o.opexGrowth) || 0;
    o.salvageValue = Number(o.salvageValue) || 0;
  });
  return a;
}

function App() {
  const [phase, setPhase] = useState("intake"); // intake | loading | report
  const [caseData, setCaseData] = useState(DEFAULT_CASE);
  const [analysis, setAnalysis] = useState(null);
  const [reportCase, setReportCase] = useState(null);
  const [stepIdx, setStepIdx] = useState(0);
  const [errors, setErrors] = useState([]);
  const stepTimer = useRef(null);

  function loadSample() {
    setCaseData({ ...DEFAULT_CASE, ...window.SAMPLE.case });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function advanceSteps() {
    // animate the stepper while waiting on the single live call
    setStepIdx(0);
    let i = 0;
    stepTimer.current = setInterval(() => {
      i = Math.min(i + 1, GEN_STEPS.length - 1);
      setStepIdx(i);
    }, 4200);
  }
  function stopSteps() { if (stepTimer.current) clearInterval(stepTimer.current); }

  async function generate() {
    setErrors([]);
    setPhase("loading");
    advanceSteps();
    const c = { ...caseData };
    let result = null;
    let usedFallback = false;
    try {
      if (!window.claude || !window.claude.complete) throw new Error("no-claude");
      const raw = await window.claude.complete(buildPrompt(c));
      result = validate(extractJSON(raw));
    } catch (e) {
      console.warn("Live analysis failed, using fallback:", e);
      usedFallback = true;
      // fallback: adapt the sample but keep the user's horizon/rate/fx
      result = JSON.parse(JSON.stringify(window.SAMPLE.analysis));
      result.model.discountRate = (Number(c.discountRate) || 12) / 100;
      result.model.horizonYears = Math.round(Number(c.horizonYears) || 10);
      result.model.fxRate = Number(c.fxRate) || 16250;
    }
    stopSteps();
    setStepIdx(GEN_STEPS.length - 1);
    setAnalysis(result);
    setReportCase(c);
    setErrors(usedFallback ? ["all sections"] : []);
    // brief settle so the final step reads as complete
    setTimeout(() => { setPhase("report"); window.scrollTo({ top: 0 }); }, 500);
  }

  function reset() {
    stopSteps();
    setAnalysis(null);
    setPhase("intake");
    window.scrollTo({ top: 0 });
  }

  useEffect(() => () => stopSteps(), []);

  return (
    <div className="app-bg">
      <Masthead phase={phase} />
      {phase === "intake" && (
        <Intake value={caseData} onChange={setCaseData} onGenerate={generate} onLoadSample={loadSample} />
      )}
      {phase === "loading" && <Loading stepIdx={stepIdx} caseData={caseData} />}
      {phase === "report" && analysis && (
        <Report analysis={analysis} caseMeta={reportCase} onReset={reset} errors={errors} />
      )}
    </div>
  );
}

function Masthead({ phase }) {
  return (
    <header className="masthead">
      <div className="masthead-inner">
        <div className="brand">
          <div className="monogram">C</div>
          <div className="brand-text">
            <div className="name">Capital Investment Advisory</div>
            <div className="sub">Real Estate · Industrial Facilities</div>
          </div>
        </div>
        <div className="masthead-meta">
          <div className="tag">CONFIDENTIAL</div>
          <div style={{ marginTop: "6px" }}>Decision support for Top Management</div>
        </div>
      </div>
    </header>
  );
}

function Loading({ stepIdx, caseData }) {
  return (
    <div className="loading-screen wrap">
      <div className="loader">
        <div className="eyebrow" style={{ justifyContent: "center" }}>Analysis in progress</div>
        <h2>Structuring the investment decision</h2>
        <div className="sub">{caseData.facilityType}{caseData.location ? " · " + caseData.location : ""} · {caseData.horizonYears}-yr horizon</div>
        <div className="steps">
          {GEN_STEPS.map((s, i) => (
            <div key={s.id} className={"step " + (i < stepIdx ? "done" : i === stepIdx ? "active" : "")}>
              <span className="dot">
                {i < stepIdx ? "✓" : i === stepIdx ? <span className="spin"></span> : i + 1}
              </span>
              <span>{s.label}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
